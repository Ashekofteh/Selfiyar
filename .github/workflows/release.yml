name: Build and Release Multi-Platform (Android, Windows, macOS, Linux, iOS)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Static Analysis
        run: flutter analyze --no-fatal-infos lib/

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/selfiyar.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-android-apk
          path: release-output/*

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Copy-Item "$releaseDir\bahonar_nut.exe" "$releaseDir\Selfiyar.exe" -Force
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "selfiyar-windows-x64.zip" -Force

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-windows-zip
          path: selfiyar-windows-x64.zip

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Application Bundle
        run: |
          cd build/macos/Build/Products/Release
          if [ -d "Selfiyar.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent Selfiyar.app ../../../../../selfiyar-macos.zip
          elif [ -d "bahonar_nut.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent bahonar_nut.app ../../../../../selfiyar-macos.zip
          fi
          cd ../../../../..

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-macos-zip
          path: selfiyar-macos.zip

  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Relocatable Tarball (.tar.gz)
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ -f "$BUNDLE_DIR/bahonar_nut" ] && [ ! -f "$BUNDLE_DIR/Selfiyar" ]; then
            cp "$BUNDLE_DIR/bahonar_nut" "$BUNDLE_DIR/Selfiyar"
          fi
          echo "[Desktop Entry]" > "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Name=سِلفیار" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "GenericName=Selfiyar" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Comment=Smart Dining Assistant for Shahid Bahonar University" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Exec=Selfiyar" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Icon=data/flutter_assets/assets/images/app_logo.png" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Terminal=false" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Type=Application" >> "$BUNDLE_DIR/Selfiyar.desktop"
          echo "Categories=Utility;" >> "$BUNDLE_DIR/Selfiyar.desktop"
          chmod +x "$BUNDLE_DIR/Selfiyar" "$BUNDLE_DIR/bahonar_nut"
          tar -czvf selfiyar-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux TAR.GZ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-linux-tar
          path: selfiyar-linux-x64.tar.gz

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Universal iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r selfiyar-ios.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfiyar-ios-ipa
          path: selfiyar-ios.ipa

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-windows, build-macos, build-linux, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      !cancelled() &&
      needs.build-android.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-windows-zip
          path: release-assets

      - name: Download macOS Artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selfiyar-macos-zip
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: selfiyar-linux-tar
          path: release-assets

      - name: Download iOS Artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selfiyar-ios-ipa
          path: release-assets

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Determine release tag, release title, and prerelease status
          CURRENT_VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          CURRENT_VERSION="${CURRENT_VERSION:-2.0.0}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            CLEAN_VER="${RELEASE_TAG#v}"
            if [[ "$RELEASE_TAG" =~ (beta|rc|alpha|dev|pre) ]]; then
              PRERELEASE_FLAG="--prerelease"
              RELEASE_TITLE="سِلفیار نسخه آزمایشی ($RELEASE_TAG)"
            else
              PRERELEASE_FLAG=""
              RELEASE_TITLE="سِلفیار نسخه ${CLEAN_VER} رسمی ($RELEASE_TAG)"
            fi
          else
            RELEASE_TAG="v${CURRENT_VERSION}-pre"
            PRERELEASE_FLAG="--prerelease"
            RELEASE_TITLE="سِلفیار پیش‌انتشار مستر ($RELEASE_TAG - $SHORT_SHA)"
          fi

          echo "Target Release Tag: $RELEASE_TAG"
          echo "Release Title: $RELEASE_TITLE"
          echo "Prerelease Flag: $PRERELEASE_FLAG"

          # 2. Locate release notes or use auto-generated notes
          NOTES_FILE=""
          TAG_UPPER=$(echo "$RELEASE_TAG" | tr '[:lower:]' '[:upper:]')
          if [ -f ".github/RELEASE_NOTES_${TAG_UPPER}.md" ]; then
            NOTES_FILE=".github/RELEASE_NOTES_${TAG_UPPER}.md"
          elif [ -f ".github/RELEASE_NOTES_${RELEASE_TAG}.md" ]; then
            NOTES_FILE=".github/RELEASE_NOTES_${RELEASE_TAG}.md"
          elif [ -n "$PRERELEASE_FLAG" ] && [ -f ".github/RELEASE_NOTES_BETA.md" ]; then
            NOTES_FILE=".github/RELEASE_NOTES_BETA.md"
          elif [ -f ".github/RELEASE_NOTES_V1.0.0.md" ]; then
            NOTES_FILE=".github/RELEASE_NOTES_V1.0.0.md"
          fi

          if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from: $NOTES_FILE"
            NOTES_ARGS=(-F "$NOTES_FILE")
          else
            echo "Using auto-generated release notes"
            NOTES_ARGS=(--generate-notes)
          fi

          # 3. Generate SHA-256 checksums
          mkdir -p release-assets
          cd release-assets
          rm -f sha256sums.txt
          shopt -s nullglob
          asset_files=( * )
          shopt -u nullglob

          if [ ${#asset_files[@]} -eq 0 ]; then
            echo "::error::No release artifacts found in release-assets!"
            exit 1
          fi

          echo "Calculating checksums for: ${asset_files[*]}"
          sha256sum "${asset_files[@]}" > sha256sums.txt
          echo "SHA256 Checksums:"
          cat sha256sums.txt
          cd ..

          # 4. Create or edit release metadata with retry
          echo "Synchronizing GitHub release metadata for $RELEASE_TAG..."
          release_synced=0
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              echo "Release $RELEASE_TAG exists. Updating release metadata (attempt $attempt)..."
              if gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                "${NOTES_ARGS[@]}" \
                $PRERELEASE_FLAG; then
                release_synced=1
                break
              fi
            else
              echo "Release $RELEASE_TAG does not exist. Creating new release (attempt $attempt)..."
              if gh release create "$RELEASE_TAG" \
                --target "${{ github.sha }}" \
                --title "$RELEASE_TITLE" \
                "${NOTES_ARGS[@]}" \
                $PRERELEASE_FLAG; then
                release_synced=1
                break
              fi
            fi
            echo "Failed to sync release metadata on attempt $attempt. Retrying in 5s..."
            sleep 5
          done

          if [ $release_synced -ne 1 ]; then
            echo "::error::Failed to create or edit GitHub release $RELEASE_TAG"
            exit 1
          fi

          # 5. Upload artifacts with per-asset retry loop and exponential backoff
          upload_asset_with_retry() {
            local tag="$1"
            local filepath="$2"
            local filename
            filename=$(basename "$filepath")
            local max_attempts=5
            local base_delay=5

            echo "::group::Uploading $filename to release $tag..."
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Uploading $filename (attempt $attempt of $max_attempts)..."
              if gh release upload "$tag" "$filepath" --clobber; then
                echo "Successfully uploaded $filename on attempt $attempt"
                echo "::endgroup::"
                return 0
              fi

              if [ $attempt -eq $max_attempts ]; then
                break
              fi

              local delay=$(( base_delay * attempt ))
              echo "Upload of $filename failed. Retrying in ${delay}s..."
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done

            echo "::endgroup::"
            echo "::error::Failed to upload $filename after $max_attempts attempts."
            return 1
          }

          echo "Uploading all platform artifacts and checksums to release $RELEASE_TAG..."
          upload_failed=0
          for asset in release-assets/*; do
            if [ -f "$asset" ]; then
              if ! upload_asset_with_retry "$RELEASE_TAG" "$asset"; then
                upload_failed=1
              fi
            fi
          done

          if [ $upload_failed -ne 0 ]; then
            echo "::error::One or more artifacts failed to upload after multiple retries."
            exit 1
          fi

          echo "All available platform artifacts uploaded successfully to $RELEASE_TAG!"
