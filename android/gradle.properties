# Cross-platform Gradle configuration. No machine-specific paths: the build
# directory stays wherever Gradle puts it, and GRADLE_USER_HOME (see
# scripts/env.sh) redirects the cache to a drive with headroom when needed.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
# Required by Flutter's Gradle plugin under AGP 9.x (without these, AGP 9
# switches to the new DSL / built-in Kotlin and fails to cast the extension).
android.newDsl=false
android.builtInKotlin=false
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin's incremental compilation caches fail to close on Windows: the
# `.tab` files are memory-mapped and locked, and the build dies with
# "Could not close incremental caches". Reproduced 2026-11-15 with
# kotlin.incremental=true against webview_flutter_android's release
# compileKotlin; the platform fault is unchanged, so keep incremental off
# here even though it costs a ~30s clean Kotlin compile per build.
kotlin.incremental=false
